[package]
name = "wordf"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Independent DOC / DOCX to PDF converter in Rust"

[dependencies]
rwml = { version = "=0.1.4", default-features = false, features = ["render", "docx"] }
docxide-pdf = { version = "=0.19.0", default-features = false }
fontique = { version = "0.11.1", default-features = false }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
cfb = "=0.10.0"
imagesize = "=0.14.0"
libc = "=0.2.191"
aes = "=0.9.3"
sha2 = "=0.11.1"
sha1 = "=0.11.0"
base64 = "=0.22.1"
quick-xml = { version = "0.41", default-features = false }
rpassword = "7.3"
zstd = { version = "0.13", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }

[build-dependencies]
zstd = "0.13"

[features]
default = ["embedded-cjk-font"]
embedded-cjk-font = ["dep:zstd"]

[patch.crates-io]
docxide-pdf = { path = "patches/docxide-pdf" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
